spring:
  application:
    name: nexadesk-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

nexadesk:
  # Company time zone: ticket reference years, business hours (SLA) and date display.
  time-zone: ${APP_TIMEZONE:Europe/Paris}
  tickets:
    reopen-window: 7d
    max-attachments-per-ticket: 5
  storage:
    location: ${STORAGE_LOCATION:./uploads}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: nexadesk
      access-token-ttl: 15m
    refresh-token:
      ttl: 7d
      cookie-name: nexadesk_refresh
      cookie-secure: ${AUTH_COOKIE_SECURE:true}
      reuse-grace: 10s
    lockout:
      max-attempts: 5
      duration: 15m
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:8088}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Enabled explicitly here; the prod profile turns both off.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
