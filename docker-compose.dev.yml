# Development: only PostgreSQL, exposed on localhost. The API runs with `mvnw spring-boot:run`
# and Angular with `npm start`. Credentials match application-dev.yml (local throwaway database only).
name: nexadesk-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexadesk
      POSTGRES_USER: nexadesk
      POSTGRES_PASSWORD: nexadesk
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexadesk -d nexadesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
