map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind the HTTPS proxy of a server (deploy/Caddyfile), keep the scheme the browser used; otherwise this
# server's own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;
    server_tokens off;

    # Security headers are added only on the locations nginx serves itself:
    # proxied API responses already carry Spring Security's headers.

    # REST API (same origin as the SPA: no CORS needed)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # STOMP over WebSocket
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Hashed build assets can be cached forever
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback; index.html itself is never cached so new deployments are picked up
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
